name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.1
  KIND_VERSION: v0.33.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt and go vet
        run: make lint
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    name: Unit and HTTP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race
        run: make test RACE=1
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

  manifests:
    name: Helm chart and SLO rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Helm lint and template
        run: make helm-lint
      - name: SLO rules match sloth output and pass promtool
        run: make slo-check

  image:
    name: Image build and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: burnrate:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root
        run: test "$(docker inspect burnrate:ci --format '{{.Config.User}}')" = "65532:65532"
      - name: Trivy scan (fail on fixable HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: burnrate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy config scan of the Helm chart
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy/helm/burnrate
          severity: HIGH,CRITICAL
          exit-code: "1"

  e2e:
    name: kind e2e (smoke and pod-kill chaos)
    runs-on: ubuntu-latest
    needs: [test, image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: ${{ env.KIND_VERSION }}
          cluster_name: burnrate
          config: deploy/kind/cluster.yaml
      - name: Install metrics-server and the chart
        run: scripts/kind-up.sh --minimal
      - name: Smoke test
        run: make smoke
      - name: Pod-kill chaos (graceful)
        run: scripts/chaos/pod-kill.sh
      - name: Pod-kill chaos (SIGKILL)
        run: scripts/chaos/pod-kill.sh --force
      - name: Record results
        if: always()
        run: |
          {
            echo "### Chaos results"
            echo '```json'
            cat chaos-results/*.json 2>/dev/null || echo "no results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n burnrate describe pods
          kubectl -n burnrate logs -l app.kubernetes.io/name=burnrate --tail=50
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chaos-results
          path: chaos-results/
          if-no-files-found: ignore
