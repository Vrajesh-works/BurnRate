{{- if .Values.slo.enabled }}
{{- /* Rules are generated by sloth from slo/burnrate.sloth.yaml (make slo). */}}
{{- $rules := .Files.Get "files/slo-rules.yaml" | fromYaml }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "burnrate.fullname" . }}-slo
  labels:
    {{- include "burnrate.labels" . | nindent 4 }}
    {{- with .Values.slo.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $rules.groups | nindent 4 }}
{{- end }}
