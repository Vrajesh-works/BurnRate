apiVersion: v1
kind: Pod
metadata:
  name: {{ include "burnrate.fullname" . }}-test-check
  labels:
    {{- include "burnrate.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: curlimages/curl:8.22.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-c"]
      args:
        - |
          set -e
          url=http://{{ include "burnrate.fullname" . }}:{{ .Values.service.port }}
          curl -fsS "$url/readyz"
          curl -fsS -X POST "$url/v1/check" -H 'Content-Type: application/json' \
            -d '{"tenant":"helm-test","key":"smoke"}' | grep '"allowed":true'
