# Minimal OpenTelemetry collector: receives OTLP from BurnRate and logs spans.
mode: deployment
fullnameOverride: otel-collector
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  kubernetesAttributes:
    enabled: false
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  exporters:
    debug:
      verbosity: basic
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      metrics: null
      logs: null
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
